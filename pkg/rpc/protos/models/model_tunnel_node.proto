syntax = "proto3";
option go_package = "./pb";

package pb;

// TunnelNode 隧道节点 (frpc)
message TunnelNode {
	int64 id = 1;
	int64 clusterId = 2;
	int64 userId = 3;
	string name = 4;
	string token = 5;
	string serverAddr = 6;
	int32 serverPort = 7;
	string os = 8;
	string arch = 9;
	string version = 10;
	bool isOn = 11;
	bool isInstalled = 12;
	int64 configVersion = 13;
	int64 createdAt = 14;
	int64 updatedAt = 15;
}

// TunnelLog 隧道节点日志
message TunnelLog {
	int64 id = 1;
	int64 tunnelNodeId = 2;
	string level = 3;
	string message = 4;
	int64 createdAt = 5;
}
